        .meaning { font-size: 24px; font-weight: bold; color: #880e4f; margin-bottom: 12px; }
        .hint { font-size: 15px; color: #ad1457; background: #ffccd5; padding: 8px 12px; border-radius: 8px; display: inline-block; margin-bottom: 15px; font-weight: 600; }
        input[type="text"] { width: 100%; padding: 15px; font-size: 20px; border: 2px solid #f8bbd0; border-radius: 10px; text-align: center; outline: none; transition: 0.2s; background: #fff; color: #333; }

        .feedback { margin-top: 15px; font-weight: bold; font-size: 16px; min-height: 24px; }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
        .btn-wrong-list { margin-top: 15px; background: #ad1457; color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 14px; display: none; width: 100%; }

    { part: 3, word: "find out", type: "Cụm động từ (phr v)", hint: "Cụm động từ", mean: "tìm ra, phát hiện" },
    { part: 3, word: "take something seriously", type: "Cụm từ (phrase)", hint: "Cụm từ", mean: "coi trọng, xem điều gì là nghiêm túc" }
];

let currentList = [];
let wrongList = [];
let currentIndex = 0;
let scoreCorrect = 0;
let scoreWrong = 0;
let isWaitingForNext = false; // Trạng thái chờ ấn Enter để qua từ tiếp theo
let hasCountedWrongForCurrent = false; // Đảm bảo mỗi từ sai chỉ bị tính 1 lần duy nhất
let isWrongReviewMode = false;

function changeMode(partNum) {
    document.querySelectorAll('.btn-mode').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    
    isWrongReviewMode = false;
    if (partNum === 0) {
        currentList = [...fullVocab];
    } else {
        currentList = fullVocab.filter(item => item.part === partNum);
    }
    resetStats();
    loadQuestion();
}

function resetStats() {
    currentIndex = 0;
    scoreCorrect = 0;
    scoreWrong = 0;
    updateStats();
}

function updateStats() {
    document.getElementById('progress-text').innerText = `Từ: ${currentIndex + 1} / ${currentList.length}`;
    document.getElementById('score-text').innerText = `Đúng: ${scoreCorrect} | Sai: ${scoreWrong}`;
    document.getElementById('wrong-count').innerText = wrongList.length;
    document.getElementById('btn-review-wrong').style.display = (wrongList.length > 0 && !isWrongReviewMode) ? 'block' : 'none';
}

function loadQuestion() {
    if (currentIndex >= currentList.length) {
        document.getElementById('meaning-display').innerText = "🎉 Chúc mừng bạn đã hoàn thành xuất sắc!";
        document.getElementById('hint-display').innerText = "Tuyệt vời! Bạn đã vượt qua tất cả các từ.";
        document.getElementById('user-input').style.display = 'none';
        document.querySelector('.btn-submit').style.display = 'none';
        document.getElementById('feedback-display').innerText = '';
        return;
    }

    document.getElementById('user-input').style.display = 'block';
    document.querySelector('.btn-submit').style.display = 'block';
    
    const item = currentList[currentIndex];
    document.getElementById('meaning-display').innerText = item.mean;
    document.getElementById('hint-display').innerText = item.hint;
    document.getElementById('user-input').value = '';
    document.getElementById('feedback-display').innerText = '';
    document.getElementById('user-input').focus();
    
    isWaitingForNext = false;
    hasCountedWrongForCurrent = false;
    updateStats();
}

function handleAction() {
    const userAns = document.getElementById('user-input').value.trim();
    const currentItem = currentList[currentIndex];
    const feedback = document.getElementById('feedback-display');

    // Trường hợp chưa nhập gì mà lỡ ấn Enter -> Không làm gì cả, không tính sai
    if (userAns === "") {
        return;
    }

    // Nếu đang ở trạng thái chờ qua từ mới mà ấn Enter -> Sang từ tiếp theo
    if (isWaitingForNext) {
        currentIndex++;
        loadQuestion();
        return;
    }

    // Kiểm tra đáp án
    if (userAns.toLowerCase() === currentItem.word.toLowerCase()) {
        feedback.innerText = "✓ Chính xác! Nhấn Enter để sang từ tiếp theo.";
        feedback.className = "feedback correct";
        scoreCorrect++;
        updateStats();
        isWaitingForNext = true; // Bật cờ chờ ấn Enter lần tiếp theo để qua từ
    } else {
        feedback.innerText = `✗ Chưa đúng! Đáp án đúng là: "${currentItem.word}". Hãy sửa lại và nhập đúng.`;
        feedback.className = "feedback wrong";
        
        // Chỉ cộng điểm sai 1 lần duy nhất cho từ này dù có ấn Enter sai nhiều lần
        if (!hasCountedWrongForCurrent) {
            scoreWrong++;
            if (!wrongList.some(w => w.word === currentItem.word)) {
                wrongList.push(currentItem);
            }
            hasCountedWrongForCurrent = true;
            updateStats();
        }
        document.getElementById('user-input').focus();
    }
}

function startWrongReview() {
    if (wrongList.length === 0) return;
    isWrongReviewMode = true;
    currentList = [...wrongList];
    wrongList = [];
    document.querySelectorAll('.btn-mode').forEach(btn => btn.classList.remove('active'));
    resetStats();
    loadQuestion();
}

document.getElementById('user-input').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
        handleAction();
    }
});

// Khởi chạy mặc định Phần 1[cite: 1]
currentList = fullVocab.filter(item => item.part === 1);
resetStats();
loadQuestion();
</script>
