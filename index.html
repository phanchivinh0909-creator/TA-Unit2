<!DOCTYPE html>

<head>

    <title>Khảo Bài Từ Vựng Unit 2</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }

        h1 { font-size: 20px; color: #1a73e8; margin-top: 0; margin-bottom: 15px; }
        .mode-select { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
        .btn-mode { padding: 8px 12px; font-size: 13px; font-weight: 600; border: 2px solid #1a73e8; background: white; color: #1a73e8; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .btn-mode.active, .btn-mode:hover { background: #1a73e8; color: white; }
        .stats-bar { display: flex; justify-content: space-between; background: #e8f0fe; padding: 8px 15px; border-radius: 8px; font-size: 13px; font-weight: bold; color: #1967d2; margin-bottom: 15px; }
        .card { background: #fafafa; border: 1px solid #e0e0e0; border-radius: 12px; padding: 20px; margin-bottom: 15px; }
        .meaning { font-size: 20px; font-weight: bold; color: #202124; margin-bottom: 8px; }
        .hint { font-size: 13px; color: #5f6368; background: #e8eaed; padding: 6px 10px; border-radius: 6px; display: inline-block; margin-bottom: 10px; }
        input[type="text"] { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #dadce0; border-radius: 8px; text-align: center; outline: none; transition: 0.2s; }
        input[type="text"]:focus { border-color: #1a73e8; }
        .btn-submit { width: 100%; margin-top: 10px; padding: 12px; font-size: 16px; font-weight: bold; background-color: #34a853; color: white; border: none; border-radius: 8px; cursor: pointer; }
        .btn-submit:hover { background-color: #2d9247; }
        .feedback { margin-top: 12px; font-weight: bold; font-size: 14px; min-height: 20px; }
        .correct { color: #137333; }
        .wrong { color: #c5221f; }
        .btn-wrong-list { margin-top: 15px; background: #ea4335; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; display: none; width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 Khảo Bài Từ Vựng - Unit 2</h1>
    
    <div class="mode-select">
        <button class="btn-mode active" onclick="changeMode(1)">Phần 1 (Trang 11)</button>
        <button class="btn-mode" onclick="changeMode(2)">Phần 2 (Trang 12)</button>
        <button class="btn-mode" onclick="changeMode(3)">Phần 3 (Trang 13+14)</button>
        <button class="btn-mode" onclick="changeMode(0)">Tất cả (110 từ)</button>
    </div>

    <div class="stats-bar">
        <span id="progress-text">Từ: 0 / 0</span>
        <span id="score-text">Đúng: 0 | Sai: 0</span>
    </div>

    <div class="card">

        <div class="hint" id="hint-display">Gợi ý...</div>
        <input type="text" id="user-input" placeholder="Gõ từ tiếng Anh..." autocomplete="off" autofocus>
        <button class="btn-submit" onclick="checkAnswer()">Kiểm tra (Enter)</button>
        <div class="feedback" id="feedback-display"></div>
    </div>

let currentList = [];
let wrongList = [];
let currentIndex = 0;
let scoreCorrect = 0;
let scoreWrong = 0;
let isWrongReviewMode = false;

function changeMode(partNum) {
    document.querySelectorAll('.btn-mode').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    
    isWrongReviewMode = false;
    if (partNum === 0) {
        currentList = [...fullVocab];
    } else {
        currentList = fullVocab.filter(item => item.part === partNum);
    }
    resetStats();
    loadQuestion();
}

function resetStats() {
    currentIndex = 0;
    scoreCorrect = 0;
    scoreWrong = 0;
    updateStats();
}

function updateStats() {
    document.getElementById('progress-text').innerText = `Từ: ${currentIndex + 1} / ${currentList.length}`;
    document.getElementById('score-text').innerText = `Đúng: ${scoreCorrect} | Sai: ${scoreWrong}`;
    document.getElementById('wrong-count').innerText = wrongList.length;
    document.getElementById('btn-review-wrong').style.display = (wrongList.length > 0 && !isWrongReviewMode) ? 'block' : 'none';
}

function loadQuestion() {
    if (currentIndex >= currentList.length) {
        document.getElementById('meaning-display').innerText = "🎉 Hoàn thành phần khảo bài!";
        document.getElementById('hint-display').innerText = "Bạn đã duyệt hết danh sách từ vựng.";
        document.getElementById('user-input').style.display = 'none';
        document.querySelector('.btn-submit').style.display = 'none';
        document.getElementById('feedback-display').innerText = '';
        return;
    }

    document.getElementById('user-input').style.display = 'block';
    document.querySelector('.btn-submit').style.display = 'block';
    
    const item = currentList[currentIndex];
    document.getElementById('meaning-display').innerText = item.mean;
    document.getElementById('hint-display').innerText = `${item.type} ${item.ipa} | Gợi ý: ${item.hint}`;
    document.getElementById('user-input').value = '';
    document.getElementById('feedback-display').innerText = '';
    document.getElementById('user-input').focus();
    updateStats();
}

function checkAnswer() {
    const userAns = document.getElementById('user-input').value.trim().toLowerCase();
    const currentItem = currentList[currentIndex];
    const feedback = document.getElementById('feedback-display');

    if (userAns === currentItem.word.toLowerCase()) {
        feedback.innerText = "✓ Chính xác!";
        feedback.className = "feedback correct";
        scoreCorrect++;
        setTimeout(() => {
            currentIndex++;
            loadQuestion();
        }, 700);
    } else {
        feedback.innerText = `✗ Sai rồi! Đáp án đúng: "${currentItem.word}"`;
        feedback.className = "feedback wrong";
        scoreWrong++;
        if (!wrongList.some(w => w.word === currentItem.word)) {
            wrongList.push(currentItem);
        }
        updateStats();
    }
}

function startWrongReview() {
    if (wrongList.length === 0) return;
    isWrongReviewMode = true;
    currentList = [...wrongList];
    wrongList = [];
    document.querySelectorAll('.btn-mode').forEach(btn => btn.classList.remove('active'));
    resetStats();
    loadQuestion();
}

document.getElementById('user-input').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
        checkAnswer();
    }
});

// Bắt đầu ứng dụng với Phần 1
currentList = fullVocab.filter(item => item.part === 1);
resetStats();
loadQuestion();
</script>
